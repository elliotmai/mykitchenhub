name: Deploy Firestore rules and indexes

# The security rules, the indexes and the Storage rules are the half of the
# backend that lives in this repository but is not code. Nothing deployed them
# before this workflow existed, so every rule the test suite proved correct was
# proving it about a file production had never seen.
#
# THE FIRST RUN IS THE MOMENT THE DATABASE LEAVES TEST MODE. Read step 7 of
# docs/DEPLOYMENT.md before pressing the button — it says what to watch
# afterwards and how to roll back. Every run after that is routine.
#
# Deploys are manual by default: the job only runs on a push once the
# repository variable AUTO_DEPLOY_RULES is set to 'true' (Settings → Secrets
# and variables → Actions → Variables). The button always works.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore/firestore.rules'
      - 'firestore/storage.rules'
      - 'firestore/firestore.indexes.json'

concurrency:
  group: deploy-rules
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_RULES == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firestore/package-lock.json

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci --prefix firestore

      # Rules are access control: a bad one either locks every cook out of their
      # own kitchen or opens everyone's to everyone. The suite that proves this
      # file correct is right here and takes twenty seconds, so it runs before
      # the deploy rather than after the incident.
      - name: Prove the rules before shipping them
        run: npm run test:rules --prefix firestore

      - name: Deploy rules, indexes and Storage rules
        run: |
          npm install -g firebase-tools
          firebase deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }} \
            --token ${{ secrets.FIREBASE_TOKEN }}

      - name: What to check now
        if: success()
        run: |
          echo "Rules, indexes and Storage rules deployed."
          echo "If this was the first run, the database has just left test mode."
          echo "Watch the rule-denial metric for a few days — docs/DEPLOYMENT.md step 10a."

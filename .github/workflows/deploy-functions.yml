name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: |
          cd functions
          npm ci

      - name: Create service account file
        run: |
          cd functions
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json

      - name: Deploy to Firebase
        run: |
          cd functions
          npm install -g firebase-tools
          firebase deploy --only functions --project ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }} --token ${{ secrets.FIREBASE_TOKEN }}
        
      - name: Clean up service account
        if: always()
        run: |
          cd functions
          rm -f service-account.json

      - name: Deployment status
        if: success()
        run: echo "✅ Firebase Functions deployed successfully!"

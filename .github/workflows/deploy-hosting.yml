name: Deploy frontend

# Nothing published the web app before this workflow existed. The build is a
# static bundle; Firebase Hosting serves it using the credentials this
# repository already holds, so no new account or secret is involved.
#
# Every commit on main that passes CI publishes itself. The button still works
# for a manual deploy of any branch.
#
# The trigger is `workflow_run` rather than `push` on purpose. A push trigger
# fires the moment the commit lands, in parallel with CI — so a commit that
# fails its tests would already be live by the time anyone saw the red X. The
# build step here would catch a bundle that cannot compile, but nothing else:
# no unit tests, no rules tests, no E2E. Waiting for CI to conclude and
# checking that conclusion is what makes "deploys itself" safe rather than
# merely automatic.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-hosting
  # Queue, do not cancel. Cancelling mid-`firebase deploy` is the one moment
  # this workflow can leave something half-published; letting them run in
  # order costs a couple of minutes and ends on the newest commit either way.
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    # A failed, cancelled or skipped CI run reaches here too — `types: [completed]`
    # means finished, not passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # The commit CI actually tested, not whatever is at the tip of main by
      # the time this starts. Two merges in quick succession would otherwise
      # publish the second one twice and the first one never.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      # REACT_APP_USE_EMULATORS is deliberately absent. If it were set the
      # shipped bundle would try to reach localhost and nothing would work for
      # anyone — the check below fails the build rather than publishing that.
      - name: Build
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_FUNCTIONS_URL: ${{ secrets.REACT_APP_FIREBASE_FUNCTIONS_URL }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
          CI: true
        run: npm run build

      # A positive assertion, not a search for something wrong: the bundle has
      # to name the project we are about to publish it to. Firebase config is
      # inlined at build time, so an emulator build carries the e2e project id
      # and a build with the secrets missing carries neither — both fail here
      # rather than going live and talking to the wrong database, or to
      # localhost, and working for nobody.
      #
      # Grepping for emulator host:port does not work: connectFirestoreEmulator
      # takes the host and the port as separate arguments, so that string never
      # appears in the bundle, and the emulator branch is not tree-shaken out of
      # a production build either. Only the injected values actually differ.
      - name: Refuse to publish a build that cannot work
        env:
          PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
        run: |
          test -f build/service-worker.js || {
            echo "::error::build/service-worker.js is missing. The app registers a"
            echo "::error::service worker at that path, so publishing without it gives"
            echo "::error::every visitor a 404 and silently no offline support."
            exit 1
          }
          grep -rq "$PROJECT_ID" build/static/js/ || {
            echo "::error::The bundle does not mention $PROJECT_ID. Either the"
            echo "::error::REACT_APP_FIREBASE_* secrets did not reach the build, or it"
            echo "::error::was built against the emulators. Publishing it would point"
            echo "::error::every visitor at the wrong database."
            exit 1
          }
          echo "Service worker present; bundle is configured for $PROJECT_ID."

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy \
            --only hosting \
            --project ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }} \
            --token ${{ secrets.FIREBASE_TOKEN }}

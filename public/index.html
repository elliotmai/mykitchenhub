<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#2E7D32" />
  <meta name="description" content="Track your kitchen inventory, reduce food waste, and plan meals" />

  <!-- iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KitchenHub" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-152x152.png" />

  <!-- No apple-touch-startup-image links: public/splash/ does not exist, so the
       three that used to sit here were 404s on every iOS launch. iOS falls back
       to the background_color and icon from the manifest, which is what an
       installed KitchenHub shows today anyway. -->

  <!-- Manifest -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Favicon -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

  <title>MyKitchenHub</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>

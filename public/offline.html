<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2E7D32" />
    <title>Offline - MyKitchenHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            color: #2E7D32;
            margin-bottom: 16px;
            font-size: 24px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        button {
            background: #2E7D32;
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1B5E20;
        }

        .tips {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #eee;
            text-align: left;
        }

        .tips h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 12px;
        }

        .tips ul {
            list-style: none;
            font-size: 14px;
            color: #666;
        }

        .tips li {
            padding: 4px 0;
        }

        .tips li::before {
            content: "✓ ";
            color: #2E7D32;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>
            It looks like you've lost your internet connection.
            Don't worry - your data is saved locally!
        </p>
        <button onclick="window.location.reload()">
            Try Again
        </button>
        <div class="tips">
            <h3>While you're offline, you can still:</h3>
            <ul>
                <li>View your cached inventory</li>
                <li>See saved recipes</li>
                <li>Check recent meal plans</li>
            </ul>
        </div>
    </div>
</body>

</html>



# The old address sends people to the new one, so the one Hive sign-in
# (a cookie for *.flyingdoublemranch.com) covers this app too.
[[redirects]]
  from = "https://mykitchenhub.netlify.app/*"
  to = "https://kitchen.flyingdoublemranch.com/:splat"
  status = 301
  force = true


# Functions are bundled before Netlify packages them (scripts/bundle-functions.mjs,
# run by `npm run build`): Netlify's own packaging produced functions that
# crashed on start with a bare 502 when they loaded the CommonJS modules in
# functions/src. The sources stay in netlify/functions.
[functions]
  directory = "netlify/functions-dist"



# The old address sends people to the new one, so the one Hive sign-in
# (a cookie for *.flyingdoublemranch.com) covers this app too.
[[redirects]]
  from = "https://mykitchenhub.netlify.app/*"
  to = "https://kitchen.flyingdoublemranch.com/:splat"
  status = 301
  force = true


# Bundle each function into one file with esbuild. With the default packager
# the functions that load the shared CommonJS modules in functions/src
# (HelloFresh import, recipes from links) crashed on start with a bare 502.
[functions]
  node_bundler = "esbuild"
